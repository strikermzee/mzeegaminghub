<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Survive Tiles</title>
<style>
  :root{
    --bg1:#7ec850; --bg2:#5fb03a;
    --panel:#1f2433; --accent:#ffd23f; --danger:#ff4d4d; --blue:#41c8ff;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;font-family:"Trebuchet MS",Verdana,sans-serif;}
  body{
    display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 20%, #9fe06a, #5fb03a 60%, #3d8a26);
    user-select:none;
  }
  #wrap{position:relative;width:100vw;height:100vh;max-width:900px;max-height:100vh;}
  canvas{display:block;width:100%;height:100%;image-rendering:auto;}

  /* HUD */
  #hud{position:absolute;top:0;left:0;right:0;padding:14px 16px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;}
  .badge{
    display:flex;align-items:center;gap:8px;
    background:linear-gradient(#fff,#e8eef5);
    border:3px solid #2a3142;border-radius:16px;
    padding:6px 14px;box-shadow:0 4px 0 #2a3142, 0 8px 14px rgba(0,0,0,.25);
    font-weight:bold;color:#2a3142;font-size:22px;
  }
  .coin{width:26px;height:26px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#fff6c0,#ffd23f 55%,#e0a712);
    border:2px solid #b3850a;display:flex;align-items:center;justify-content:center;
    color:#8a6406;font-size:15px;}
  #score{font-size:18px;}

  /* Overlays */
  .overlay{position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:18px;text-align:center;
    background:rgba(15,20,30,.55);backdrop-filter:blur(3px);padding:24px;}
  .overlay.hidden{display:none;}
  .title{font-size:clamp(38px,9vw,72px);font-weight:900;color:#fff;
    text-shadow:0 4px 0 #2a3142, 0 8px 18px rgba(0,0,0,.4);letter-spacing:1px;}
  .title .t2{color:var(--accent);}
  .sub{color:#fff;font-size:clamp(15px,3.5vw,20px);max-width:440px;line-height:1.5;
    text-shadow:0 2px 4px rgba(0,0,0,.4);}
  .btn{
    cursor:pointer;border:none;font-family:inherit;font-weight:bold;
    font-size:clamp(20px,5vw,28px);color:#3a2a00;
    background:linear-gradient(#ffe16b,#ffc01f);
    border:3px solid #2a3142;border-radius:18px;padding:14px 40px;
    box-shadow:0 6px 0 #b3850a, 0 10px 18px rgba(0,0,0,.3);
    transition:transform .06s, box-shadow .06s;}
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 #b3850a;}
  .big{font-size:clamp(26px,7vw,44px);color:#fff;font-weight:900;text-shadow:0 3px 0 #2a3142;}
  .stat{color:var(--accent);font-weight:900;}
  .controls{color:#dfe7ee;font-size:14px;opacity:.9;margin-top:4px;}

  #touch{position:absolute;bottom:18px;left:0;right:0;display:none;justify-content:center;pointer-events:none;}
  .dpad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(3,58px);gap:6px;pointer-events:auto;}
  .dpad button{font-size:24px;border:3px solid #2a3142;border-radius:14px;
    background:rgba(255,255,255,.85);box-shadow:0 4px 0 #2a3142;font-weight:bold;color:#2a3142;}
  .dpad button:active{transform:translateY(3px);box-shadow:0 1px 0 #2a3142;}
  .dpad .sp{visibility:hidden;}
  @media (pointer:coarse){#touch{display:flex;}}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>

  <div id="hud">
    <div class="badge"><div class="coin">$</div><span id="cash">0</span></div>
    <div class="badge" id="score">Wave 1</div>
  </div>

  <div id="touch">
    <div class="dpad">
      <div class="sp"></div><button data-dir="up">▲</button><div class="sp"></div>
      <button data-dir="left">◄</button><div class="sp"></div><button data-dir="right">►</button>
      <div class="sp"></div><button data-dir="down">▼</button><div class="sp"></div>
    </div>
  </div>

  <div class="overlay" id="startScreen">
    <div class="title">SURVIVE <span class="t2">TILES</span></div>
    <div class="sub">Tiles flash <b style="color:#41c8ff">blue</b>, turn <b style="color:#ff4d4d">red</b>, then collapse.
       Keep moving, grab the coins, and don't get caught standing on a falling tile — or over a hole!</div>
    <button class="btn" id="startBtn">PLAY</button>
    <div class="controls">Move: WASD / Arrow Keys &nbsp;•&nbsp; On phone use the on-screen pad</div>
  </div>

  <div class="overlay hidden" id="overScreen">
    <div class="big">GAME OVER</div>
    <div class="sub">You banked <span class="stat" id="finalCash">$0</span><br>and survived to <span class="stat" id="finalWave">Wave 1</span></div>
    <div class="sub" id="bestLine" style="font-size:16px;opacity:.85;"></div>
    <button class="btn" id="retryBtn">PLAY AGAIN</button>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  // ---------- Config ----------
  const GRID = 7;                 // grid is GRID x GRID
  const TW = 64, TH = 32;         // tile diamond width / height
  const TZ = 18;                  // tile thickness (3D side)
  let DPR = Math.min(window.devicePixelRatio || 1, 2);

  // Tile states
  const SAFE = 0, WARN = 1, HOT = 2, HOLE = 3;

  // ---------- State ----------
  let tiles = [];        // {state, timer, total}
  let player;            // {gx,gy, px,py, hopT}
  let coins = [];        // {gx,gy, bob}
  let particles = [];
  let cash, wave, waveTimer, running, gameOverFlag, spawnAccel;
  let shake = 0;
  let best = +(localStorage.getItem('surviveTilesBest') || 0);

  // ---------- Sizing ----------
  function resize(){
    const w = canvas.clientWidth || canvas.parentElement.clientWidth || window.innerWidth;
    const h = canvas.clientHeight || canvas.parentElement.clientHeight || window.innerHeight;
    if(w<=0||h<=0) return;
    if(canvas.width!==Math.round(w*DPR) || canvas.height!==Math.round(h*DPR)){
      canvas.width = Math.round(w * DPR); canvas.height = Math.round(h * DPR);
    }
  }
  window.addEventListener('resize', resize);

  // origin so the iso grid is centered
  function origin(){
    const w = canvas.width / DPR, h = canvas.height / DPR;
    return { ox: w/2, oy: h/2 - (GRID*TH)/2 + 30 };
  }
  function isoPos(gx, gy){
    const {ox, oy} = origin();
    return {
      x: ox + (gx - gy) * (TW/2),
      y: oy + (gx + gy) * (TH/2)
    };
  }

  // ---------- Game setup ----------
  function reset(){
    tiles = [];
    for (let y=0;y<GRID;y++) for (let x=0;x<GRID;x++)
      tiles.push({state:SAFE, timer:0, total:0});
    const c = Math.floor(GRID/2);
    player = {gx:c, gy:c, px:c, py:c, hopT:1, fromx:c, fromy:c};
    coins = [];
    particles = [];
    cash = 0; wave = 1; waveTimer = 0; spawnAccel = 1;
    running = true; gameOverFlag = false; shake = 0;
    spawnCoin(); spawnCoin();
    updateHUD();
    document.getElementById('startScreen').classList.add('hidden');
    document.getElementById('overScreen').classList.add('hidden');
  }

  function tile(x,y){ return tiles[y*GRID+x]; }
  function inBounds(x,y){ return x>=0 && y>=0 && x<GRID && y<GRID; }

  function spawnCoin(){
    let tries=0;
    while(tries++<40){
      const x=(Math.random()*GRID)|0, y=(Math.random()*GRID)|0;
      const t=tile(x,y);
      if(t.state===SAFE && !(x===player.gx&&y===player.gy) && !coins.some(c=>c.gx===x&&c.gy===y)){
        coins.push({gx:x,gy:y,bob:Math.random()*6.28});
        return;
      }
    }
  }

  // pick tiles to warn -> they will collapse
  function triggerWave(){
    wave++;
    const count = Math.min(3 + Math.floor(wave/2), GRID*GRID-6);
    const warnTime = Math.max(0.85, 1.7 - wave*0.04);   // gets faster
    let placed=0, tries=0;
    while(placed<count && tries++<200){
      const x=(Math.random()*GRID)|0, y=(Math.random()*GRID)|0;
      const t=tile(x,y);
      if(t.state===SAFE){
        t.state=WARN; t.timer=warnTime; t.total=warnTime;
        placed++;
      }
    }
    if(Math.random()<0.8) spawnCoin();
    updateHUD();
  }

  function updateHUD(){
    document.getElementById('cash').textContent = cash;
    document.getElementById('score').textContent = 'Wave ' + wave;
  }

  // ---------- Particles ----------
  function burst(gx,gy,color,n){
    const p = isoPos(gx,gy);
    for(let i=0;i<n;i++){
      particles.push({
        x:p.x + (Math.random()-.5)*TW*0.7,
        y:p.y + (Math.random()-.5)*TH*0.7,
        vx:(Math.random()-.5)*60,
        vy:-Math.random()*120-30,
        g:260, life:1, color, size:2+Math.random()*4
      });
    }
  }

  // ---------- Input ----------
  function move(dx,dy){
    if(!running || player.hopT<1) return;
    const nx=player.gx+dx, ny=player.gy+dy;
    if(!inBounds(nx,ny)) return;
    const t=tile(nx,ny);
    if(t.state===HOLE){ // stepping into a hole = death
      player.fromx=player.gx; player.fromy=player.gy;
      player.gx=nx; player.gy=ny; player.hopT=0; player._fall=true;
      die();
      return;
    }
    player.fromx=player.gx; player.fromy=player.gy;
    player.gx=nx; player.gy=ny; player.hopT=0;
  }

  window.addEventListener('keydown', e=>{
    const k=e.key.toLowerCase();
    if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
    if(!running){ if(k===' '||k==='enter'){ if(gameOverFlag||startVisible()) reset(); } return; }
    if(k==='w'||k==='arrowup') move(0,-1);
    else if(k==='s'||k==='arrowdown') move(0,1);
    else if(k==='a'||k==='arrowleft') move(-1,0);
    else if(k==='d'||k==='arrowright') move(1,0);
  });
  function startVisible(){ return !document.getElementById('startScreen').classList.contains('hidden'); }

  document.querySelectorAll('#touch [data-dir]').forEach(b=>{
    b.addEventListener('click',()=>{
      const d=b.dataset.dir;
      if(d==='up')move(0,-1); if(d==='down')move(0,1);
      if(d==='left')move(-1,0); if(d==='right')move(1,0);
    });
  });

  document.getElementById('startBtn').onclick = reset;
  document.getElementById('retryBtn').onclick = reset;

  // ---------- Death ----------
  function die(){
    if(gameOverFlag) return;
    running=false; gameOverFlag=true;
    shake = 16;
    burst(player.gx,player.gy,'#ff4d4d',26);
    if(cash>best){ best=cash; localStorage.setItem('surviveTilesBest',best); }
    setTimeout(()=>{
      document.getElementById('finalCash').textContent = '$'+cash;
      document.getElementById('finalWave').textContent = 'Wave '+wave;
      document.getElementById('bestLine').textContent = 'Best bank: $'+best;
      document.getElementById('overScreen').classList.remove('hidden');
    }, 650);
  }

  // ---------- Update ----------
  let last=performance.now();
  function update(dt){
    if(running){
      // wave timer
      waveTimer -= dt;
      if(waveTimer<=0){
        triggerWave();
        waveTimer = Math.max(1.0, 2.6 - wave*0.05);
      }

      // tile state machine
      for(let i=0;i<tiles.length;i++){
        const t=tiles[i];
        if(t.state===WARN){
          t.timer-=dt;
          if(t.timer<=0){ t.state=HOT; t.timer=0.45; t.total=0.45;
            const x=i%GRID, y=(i/GRID)|0; burst(x,y,'#ffb14d',6); }
        } else if(t.state===HOT){
          t.timer-=dt;
          if(t.timer<=0){
            t.state=HOLE; t.timer=Math.max(2.2,4.5 - wave*0.05);
            const x=i%GRID, y=(i/GRID)|0;
            burst(x,y,'#9fb3c8',16);
            shake=Math.max(shake,5);
            // collapse on the player => death
            if(player.gx===x && player.gy===y && player.hopT>=1){ die(); }
          }
        } else if(t.state===HOLE){
          t.timer-=dt;
          if(t.timer<=0){ t.state=SAFE; const x=i%GRID,y=(i/GRID)|0; burst(x,y,'#a6e368',8);}
        }
      }
    }

    // player hop animation
    if(player.hopT<1){
      player.hopT=Math.min(1, player.hopT + dt*6.5);
      const e = player._fall ? player.hopT : easeOut(player.hopT);
      player.px = player.fromx + (player.gx-player.fromx)*e;
      player.py = player.fromy + (player.gy-player.fromy)*e;
      if(player.hopT>=1){
        player.px=player.gx; player.py=player.gy;
        // landed: collect coin
        for(let i=coins.length-1;i>=0;i--){
          if(coins[i].gx===player.gx && coins[i].gy===player.gy){
            cash += 10 + wave; // worth more later
            burst(player.gx,player.gy,'#ffd23f',14);
            coins.splice(i,1); updateHUD();
            if(coins.length<2) spawnCoin();
          }
        }
        // landed on a hole? death
        const t=tile(player.gx,player.gy);
        if(t.state===HOLE) die();
      }
    }

    // coins bob
    coins.forEach(c=>c.bob+=dt*4);

    // particles
    for(let i=particles.length-1;i>=0;i--){
      const p=particles[i];
      p.vy+=p.g*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt*1.3;
      if(p.life<=0) particles.splice(i,1);
    }

    if(shake>0) shake=Math.max(0, shake-dt*40);
  }
  function easeOut(t){ return 1-Math.pow(1-t,3); }

  // ---------- Render ----------
  function drawTileTop(cx,cy,topColor){
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx+TW/2, cy+TH/2);
    ctx.lineTo(cx, cy+TH);
    ctx.lineTo(cx-TW/2, cy+TH/2);
    ctx.closePath();
    ctx.fillStyle=topColor; ctx.fill();
  }
  function drawCube(cx,cy,top,left,right,depth){
    // top
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx+TW/2, cy+TH/2);
    ctx.lineTo(cx, cy+TH);
    ctx.lineTo(cx-TW/2, cy+TH/2);
    ctx.closePath();
    ctx.fillStyle=top; ctx.fill();
    // left face
    ctx.beginPath();
    ctx.moveTo(cx-TW/2, cy+TH/2);
    ctx.lineTo(cx, cy+TH);
    ctx.lineTo(cx, cy+TH+depth);
    ctx.lineTo(cx-TW/2, cy+TH/2+depth);
    ctx.closePath();
    ctx.fillStyle=left; ctx.fill();
    // right face
    ctx.beginPath();
    ctx.moveTo(cx+TW/2, cy+TH/2);
    ctx.lineTo(cx, cy+TH);
    ctx.lineTo(cx, cy+TH+depth);
    ctx.lineTo(cx+TW/2, cy+TH/2+depth);
    ctx.closePath();
    ctx.fillStyle=right; ctx.fill();
  }

  function render(t){
    const w=canvas.width/DPR, h=canvas.height/DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.clearRect(0,0,w,h);

    // camera shake
    let sx=0, sy=0;
    if(shake>0){ sx=(Math.random()-.5)*shake; sy=(Math.random()-.5)*shake; }
    ctx.save(); ctx.translate(sx,sy);

    // draw tiles back-to-front
    for(let y=0;y<GRID;y++){
      for(let x=0;x<GRID;x++){
        const t0=tile(x,y);
        const p=isoPos(x,y);
        const cx=p.x, cy=p.y;

        if(t0.state===HOLE){
          // dark pit
          drawCube(cx,cy,'#1c2330','#11161f','#161c28',TZ);
          continue;
        }

        // base colors (grass-ish checker)
        let top, left, right;
        const even=(x+y)%2===0;
        top   = even? '#8fd95a' : '#83cf4f';
        left  = even? '#5fa336' : '#578f30';
        right = even? '#73be46' : '#69b03d';

        if(t0.state===WARN){
          const k=1-(t0.timer/t0.total); // 0..1
          const pulse=0.5+0.5*Math.sin(t*0.02 + (x+y));
          const mix = Math.min(1, k+0.15);
          top = blend('#8fd95a', '#41c8ff', 0.4+0.5*pulse*mix);
          left = blend('#5fa336', '#1f8fcf', 0.5);
          right= blend('#73be46', '#2aa6e0', 0.5);
        } else if(t0.state===HOT){
          const pulse=0.5+0.5*Math.sin(t*0.05);
          top = blend('#ff7a3c','#ff2e2e',pulse);
          left='#b51d1d'; right='#d62626';
        }

        drawCube(cx,cy,top,left,right,TZ);

        // warning glow ring
        if(t0.state===WARN || t0.state===HOT){
          ctx.save();
          ctx.globalAlpha = t0.state===HOT? 0.55 : 0.4;
          ctx.strokeStyle = t0.state===HOT? '#ffec8a':'#bff0ff';
          ctx.lineWidth=2;
          ctx.beginPath();
          ctx.moveTo(cx, cy+2);
          ctx.lineTo(cx+TW/2-3, cy+TH/2);
          ctx.lineTo(cx, cy+TH-2);
          ctx.lineTo(cx-TW/2+3, cy+TH/2);
          ctx.closePath(); ctx.stroke();
          ctx.restore();
        }

        // coin on this tile
        const coin=coins.find(c=>c.gx===x&&c.gy===y);
        if(coin){
          const bz=Math.sin(coin.bob)*4;
          const ccx=cx, ccy=cy+TH/2-14+bz;
          ctx.save();
          ctx.shadowColor='rgba(0,0,0,.3)'; ctx.shadowBlur=6; ctx.shadowOffsetY=4;
          const g=ctx.createRadialGradient(ccx-4,ccy-4,1,ccx,ccy,12);
          g.addColorStop(0,'#fff6c0'); g.addColorStop(.55,'#ffd23f'); g.addColorStop(1,'#e0a712');
          ctx.fillStyle=g;
          ctx.beginPath(); ctx.ellipse(ccx,ccy,11,11,0,0,6.28); ctx.fill();
          ctx.shadowColor='transparent';
          ctx.fillStyle='#8a6406'; ctx.font='bold 14px Trebuchet MS';
          ctx.textAlign='center'; ctx.textBaseline='middle';
          ctx.fillText('$',ccx,ccy+1);
          ctx.restore();
        }

        // player on this tile (draw when its grid cell is the rounded player pos)
        if(Math.round(player.py)===y && Math.round(player.px)===x){
          drawPlayer(t);
        }
      }
    }

    // particles
    for(const p of particles){
      ctx.globalAlpha=Math.max(0,p.life);
      ctx.fillStyle=p.color;
      ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);
    }
    ctx.globalAlpha=1;

    ctx.restore();
  }

  function drawPlayer(t){
    const p=isoPos(player.px,player.py);
    const hop = player._fall ? -player.hopT*40 : -Math.sin(player.hopT*Math.PI)*22;
    const cx=p.x, cy=p.y+TH/2 - 6 + hop;
    const alpha = player._fall ? Math.max(0,1-player.hopT) : 1;
    ctx.save(); ctx.globalAlpha=alpha;
    // shadow
    ctx.globalAlpha=0.25*alpha; ctx.fillStyle='#000';
    ctx.beginPath(); ctx.ellipse(p.x, p.y+TH/2+2, 14, 7, 0,0,6.28); ctx.fill();
    ctx.globalAlpha=alpha;
    // body cube
    const s=14;
    const top='#ffe16b', l='#cf8e12', r='#e6a719';
    // top
    ctx.beginPath();
    ctx.moveTo(cx,cy-s); ctx.lineTo(cx+s*0.9,cy-s+s*0.5);
    ctx.lineTo(cx,cy-s+s); ctx.lineTo(cx-s*0.9,cy-s+s*0.5); ctx.closePath();
    ctx.fillStyle=top; ctx.fill();
    // faces
    ctx.beginPath();
    ctx.moveTo(cx-s*0.9,cy-s+s*0.5); ctx.lineTo(cx,cy-s+s);
    ctx.lineTo(cx,cy+s*0.7); ctx.lineTo(cx-s*0.9,cy-s+s*0.5+s*1.1); ctx.closePath();
    ctx.fillStyle=l; ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx+s*0.9,cy-s+s*0.5); ctx.lineTo(cx,cy-s+s);
    ctx.lineTo(cx,cy+s*0.7); ctx.lineTo(cx+s*0.9,cy-s+s*0.5+s*1.1); ctx.closePath();
    ctx.fillStyle=r; ctx.fill();
    // eyes
    ctx.fillStyle='#2a2030';
    ctx.beginPath(); ctx.ellipse(cx-4,cy-2,1.6,2.4,0,0,6.28); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx+4,cy-2,1.6,2.4,0,0,6.28); ctx.fill();
    ctx.restore();
  }

  // color blend helper
  function blend(a,b,t){
    const ca=hex(a), cb=hex(b);
    const r=Math.round(ca[0]+(cb[0]-ca[0])*t);
    const g=Math.round(ca[1]+(cb[1]-ca[1])*t);
    const bl=Math.round(ca[2]+(cb[2]-ca[2])*t);
    return `rgb(${r},${g},${bl})`;
  }
  function hex(h){ h=h.replace('#',''); return [parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)]; }

  // ---------- Loop ----------
  let tickScheduled=false;
  function tick(now){
    tickScheduled=false;
    const dt=Math.min(0.05,(now-last)/1000); last=now;
    try{
      resize();
      update(dt);
      render(now);
    }catch(err){
      console.error('frame error', err);
    }
    schedule();
  }
  // Prefer rAF (smooth, vsync). Fall back to setTimeout when rAF is starved
  // (e.g. a backgrounded/hidden tab) so the game keeps ticking.
  function schedule(){
    if(tickScheduled) return;
    tickScheduled=true;
    let fired=false;
    requestAnimationFrame(ts=>{ if(fired) return; fired=true; tick(ts || performance.now()); });
    setTimeout(()=>{ if(fired) return; fired=true; tick(performance.now()); }, 60);
  }

  // ---------- Init ----------
  resize();
  // initialize a dormant board behind the start screen
  for(let i=0;i<GRID*GRID;i++) tiles.push({state:SAFE,timer:0,total:0});
  const c=Math.floor(GRID/2);
  player={gx:c,gy:c,px:c,py:c,hopT:1,fromx:c,fromy:c};
  cash=0; wave=1; running=false; gameOverFlag=false;
  schedule();
})();
</script>
