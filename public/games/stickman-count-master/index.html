<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Stickman Count Master</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  html,body { height:100%; overflow:hidden; background:#0a1830; font-family:'Segoe UI', system-ui, sans-serif; }
  #wrap { position:relative; width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
  canvas { display:block; touch-action:none; }

  /* ---------- top progress bar ---------- */
  #topbar {
    position:absolute; top:10px; left:50%; transform:translateX(-50%);
    width:min(94%, 480px); display:flex; flex-direction:column; align-items:center; gap:6px;
    color:#fff; pointer-events:none; z-index:5;
  }
  #lvlLabel { font-weight:800; letter-spacing:2px; font-size:15px; text-shadow:0 2px 4px rgba(0,0,0,.5); }
  #track {
    display:flex; align-items:center; gap:6px; background:rgba(20,40,70,.55);
    padding:7px; border-radius:14px; backdrop-filter:blur(3px); box-shadow:0 4px 14px rgba(0,0,0,.35);
  }
  .thumb {
    width:54px; height:42px; border-radius:9px; flex:0 0 auto;
    background:linear-gradient(160deg,#bfe6ff,#5aa7e6); border:2px solid #fff;
    display:flex; align-items:center; justify-content:center; font-size:20px;
    box-shadow:inset 0 0 8px rgba(255,255,255,.4);
  }
  .seg { width:20px; height:20px; border-radius:6px; background:rgba(255,255,255,.18);
    display:flex; align-items:center; justify-content:center; font-size:12px; flex:0 0 auto; }
  .seg.done { background:#5cc8ff; }
  .seg.cur  { background:#ffd24a; box-shadow:0 0 8px #ffd24a; }
  .seg.boss { background:rgba(120,30,40,.6); }
  .seg.boss.done { background:#c0392b; }

  #coins {
    position:absolute; top:14px; right:14px; z-index:6; display:flex; align-items:center; gap:6px;
    background:rgba(20,40,70,.6); color:#ffe27a; font-weight:800; font-size:17px;
    padding:7px 13px; border-radius:20px; box-shadow:0 4px 12px rgba(0,0,0,.35);
  }

  /* ---------- hint pill ---------- */
  #hint {
    position:absolute; top:46%; left:50%; transform:translate(-50%,-50%); z-index:5;
    background:rgba(15,30,55,.78); color:#fff; font-weight:700; font-size:16px;
    padding:11px 20px; border-radius:30px; display:flex; align-items:center; gap:9px;
    box-shadow:0 6px 18px rgba(0,0,0,.4); animation:pulse 1.3s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:.78} 50%{opacity:1} }
  #hint .key { background:#fff; color:#16263f; border-radius:7px; padding:2px 9px; font-size:14px; font-weight:800; }

  /* ---------- upgrade cards ---------- */
  #cards { position:absolute; bottom:14px; left:50%; transform:translateX(-50%);
    width:min(94%,480px); display:flex; gap:12px; z-index:5; }
  .card {
    flex:1; cursor:pointer; border-radius:16px; padding:10px 8px 12px;
    background:linear-gradient(170deg, rgba(95,135,195,.92), rgba(60,95,160,.92));
    border:2px solid rgba(255,255,255,.35); color:#fff; text-align:center;
    box-shadow:0 6px 16px rgba(0,0,0,.4); position:relative; transition:transform .08s;
  }
  .card:active { transform:translateY(3px); }
  .card .lvl { position:absolute; top:8px; left:8px; font-size:11px; font-weight:800; line-height:1.05;
    background:rgba(0,0,0,.25); padding:3px 6px; border-radius:7px; text-align:left; }
  .card .icon { font-size:40px; margin:4px 0 2px; filter:drop-shadow(0 3px 4px rgba(0,0,0,.4)); }
  .card .name { font-weight:800; font-size:15px; margin-bottom:7px; }
  .card .cost { background:rgba(255,255,255,.16); border-radius:10px; padding:6px;
    font-weight:800; font-size:16px; display:flex; align-items:center; justify-content:center; gap:6px; }
  .card.afford .cost { color:#ffe27a; }
  .card.locked { opacity:.55; }

  /* ---------- end screen ---------- */
  .overlay { position:absolute; inset:0; z-index:20; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:16px; text-align:center; color:#fff;
    background:rgba(8,16,32,.8); backdrop-filter:blur(4px); padding:24px; }
  .hidden { display:none !important; }
  h2 { font-size:clamp(26px,7vw,46px); text-shadow:0 4px 0 rgba(0,0,0,.35); }
  .ostat { font-size:clamp(17px,4.4vw,22px); opacity:.95; max-width:420px; line-height:1.5; }
  .reward { font-size:20px; font-weight:800; color:#ffe27a; }
  .btn { cursor:pointer; border:none; border-radius:16px; padding:15px 40px; font-size:22px; font-weight:800;
    color:#06210b; background:linear-gradient(#86ff82,#34c93f); box-shadow:0 6px 0 #1c8528, 0 10px 20px rgba(0,0,0,.4);
    transition:transform .07s, box-shadow .07s; }
  .btn:active { transform:translateY(4px); box-shadow:0 2px 0 #1c8528, 0 4px 10px rgba(0,0,0,.4); }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="scene"></canvas>

  <div id="coins">💰 <span id="coinVal">0</span></div>

  <div id="topbar">
    <div id="lvlLabel">LEVEL 1</div>
    <div id="track"><div class="thumb" id="thumb">🏔️</div><div id="segs" style="display:flex;gap:6px"></div></div>
  </div>

  <div id="hint">PRESS <span class="key">SPACE</span> OR CLICK 🖱️</div>

  <div id="cards">
    <div class="card" id="cardUnits">
      <div class="lvl">LVL<br><span id="unitsLvl">1</span></div>
      <div class="icon">🧍</div>
      <div class="name">Start Units</div>
      <div class="cost"><span id="unitsCost">100</span> 🪙</div>
    </div>
    <div class="card" id="cardIncome">
      <div class="lvl">LVL<br><span id="incomeLvl">1</span></div>
      <div class="icon">💵</div>
      <div class="name">Income</div>
      <div class="cost"><span id="incomeCost">100</span> 🪙</div>
    </div>
  </div>

  <div class="overlay hidden" id="endScreen">
    <h2 id="endTitle">Victory!</h2>
    <p class="ostat" id="endStat"></p>
    <p class="reward" id="endReward"></p>
    <button class="btn" id="nextBtn">CONTINUE</button>
  </div>
</div>

<script>
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');

/* ---------------- sizing ---------------- */
let W,H,DPR;
function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = Math.min(window.innerWidth, 520);
  H = window.innerHeight;
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  canvas.width=Math.floor(W*DPR); canvas.height=Math.floor(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  computeCam();
}
window.addEventListener('resize', resize);

/* ---------------- perspective camera ---------------- */
let horizonY, nearY, roadHalfNear, camDist=5;
function computeCam(){
  horizonY = H*0.20;
  nearY = H*0.78;
  roadHalfNear = W*0.46;
}
function project(x,z){
  const f = camDist/(camDist+z);
  return { x: W/2 + x*roadHalfNear*f, y: horizonY+(nearY-horizonY)*f, f };
}

/* ---------------- persistent meta ---------------- */
const save = {
  coins: +(localStorage.getItem('scm_coins')||0),
  unitsLvl: +(localStorage.getItem('scm_units')||1),
  incomeLvl: +(localStorage.getItem('scm_income')||1),
  level: +(localStorage.getItem('scm_level')||1),
};
function persist(){
  localStorage.setItem('scm_coins',save.coins);
  localStorage.setItem('scm_units',save.unitsLvl);
  localStorage.setItem('scm_income',save.incomeLvl);
  localStorage.setItem('scm_level',save.level);
}
const unitsCost = ()=> 100*save.unitsLvl;
const incomeCost = ()=> 100*save.incomeLvl;
const startUnits = ()=> save.unitsLvl;          // starting crowd size
const incomeMult = ()=> save.incomeLvl;         // coins per surviving unit

/* ---------------- game state ---------------- */
let state='lobby';   // lobby | run | battle | end
let count=1, leaderX=0, targetX=0;
let crowd=[], objects=[], particles=[], splats=[];
let speed=0.12, enemyCount=0, battleEnemy=0, battleTimer=0;
let enemyMob=[];   // fixed positions for the red stickman enemies
let isBoss=false, bossHP=0, runKind='normal';
let bonus={idx:0, dir:1, locked:-1};
let bossReward={base:20, angle:Math.PI*1.5, dir:1, stopped:false, mult:1};
const bonusSteps=[
  {m:1.0,c:'#f3b53f'},{m:1.2,c:'#9ccc5a'},{m:1.4,c:'#e8923c'},
  {m:1.6,c:'#7e57c2'},{m:1.8,c:'#b3a14a'},{m:2.0,c:'#4db6ac'},
  {m:2.5,c:'#42a5f5'},{m:3.0,c:'#ec407a'}];
function levelKind(lv){
  if(lv<=1) return 'normal';
  if(lv%5===0) return 'boss';            // every 5th level: giant red stickman boss
  return Math.random()<0.4 ? 'bonus' : 'normal';   // bonus can appear on ANY level
}

/* ---------------- crowd ---------------- */
function makeCrowd(n){
  crowd=[];
  for(let i=0;i<n;i++){
    const ring=Math.sqrt(i);
    crowd.push({ ox:(Math.random()*2-1)*(0.04+ring*0.018),
                 oz:Math.random()*ring*0.06,
                 ph:Math.random()*6.28 });
  }
}
function setCount(n){
  n=Math.max(0,Math.round(n));
  count=n;
  if(crowd.length<n) makeCrowd(n);
  else if(n<crowd.length) crowd.length=Math.max(0,n);
}

/* ---------------- level build ---------------- */
function buildLevel(){
  objects=[]; particles=[]; splats=[];
  const safe = save.level<=1;          // first level: no defeat possible
  const gates = 4 + Math.min(save.level,7);
  let z = 8;
  const step = 5.2;
  for(let i=0;i<gates;i++){
    z += step;
    if(!safe && Math.random()<0.38){
      const kinds=['pillar','rock','gear'];
      const kind=kinds[Math.floor(Math.random()*kinds.length)];
      objects.push({type:kind, z, side: Math.random()<0.5?-1:1,
                    dmg: 5+Math.floor(save.level*1.5)});
    } else {
      objects.push({type:'gate', z, ...randomGatePair(safe)});
    }
  }
  z += step;
  if(isBoss){
    bossHP = Math.round(40 + save.level*28);
    objects.push({type:'finish', z, boss:true});
  } else {
    enemyCount = safe ? 8 : Math.max(10, Math.round((12+save.level*16)*(0.85+Math.random()*0.3)));
    objects.push({type:'finish', z, enemy:enemyCount});
  }
}
function randomGatePair(safe){
  const good=[{k:'mul',v:2,t:'×2'},{k:'mul',v:3,t:'×3'},{k:'add',v:40,t:'+40'},
              {k:'add',v:80,t:'+80'},{k:'add',v:100,t:'+100'}];
  const bad=[{k:'sub',v:20,t:'−20'},{k:'sub',v:40,t:'−40'},{k:'div',v:2,t:'÷2'},{k:'add',v:10,t:'+10'}];
  const a=good[Math.floor(Math.random()*good.length)];
  const useBad = !safe && Math.random()<0.5;   // safe levels never spawn a bad gate
  const pool=useBad?bad:good;
  const b=pool[Math.floor(Math.random()*pool.length)];
  return Math.random()<0.5?{left:a,right:b}:{left:b,right:a};
}
function applyOp(op){
  let n=count;
  if(op.k==='mul')n=count*op.v; else if(op.k==='div')n=Math.floor(count/op.v);
  else if(op.k==='add')n=count+op.v; else if(op.k==='sub')n=count-op.v;
  setCount(n);
  const bad = op.k==='sub'||op.k==='div';
  const p=project(leaderX,0.4);
  burst(p.x,p.y,bad?'#ff5a5a':'#7dff9a',18);
}

/* ---------------- effects ---------------- */
function burst(x,y,c,n=12){ for(let i=0;i<n;i++) particles.push({x,y,vx:(Math.random()*2-1)*3,vy:-Math.random()*6-1,life:1,c}); }
function addSplat(x,y){ splats.push({x,y,r:0,max:60+Math.random()*30,life:1}); }

/* ---------------- input ---------------- */
function nx(e){
  const r=canvas.getBoundingClientRect();
  const cx=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
  return Math.max(-1,Math.min(1,(cx/r.width-0.5)*2.1));
}
let dragging=false;
canvas.addEventListener('pointerdown',e=>{ dragging=true; targetX=nx(e); });
canvas.addEventListener('pointermove',e=>{ if(state==='run') targetX=nx(e); });
window.addEventListener('pointerup',()=>dragging=false);
window.addEventListener('keydown',e=>{
  if(e.code==='Space'){ e.preventDefault();
    if(state==='lobby') startRun();
    else if(state==='bonus') lockBonus();
    else if(state==='bossreward') bossRewardAction();
  }
  if(e.key==='ArrowLeft') targetX=Math.max(-1,targetX-0.18);
  if(e.key==='ArrowRight') targetX=Math.min(1,targetX+0.18);
});
canvas.addEventListener('click',()=>{
  if(state==='lobby') startRun();
  else if(state==='bonus') lockBonus();
  else if(state==='bossreward') bossRewardAction();
});

/* ---------------- upgrade cards ---------------- */
document.getElementById('cardUnits').onclick=()=>{
  if(state!=='lobby') return;
  if(save.coins>=unitsCost()){ save.coins-=unitsCost(); save.unitsLvl++; persist(); refreshUI(); setCount(startUnits()); }
};
document.getElementById('cardIncome').onclick=()=>{
  if(state!=='lobby') return;
  if(save.coins>=incomeCost()){ save.coins-=incomeCost(); save.incomeLvl++; persist(); refreshUI(); }
};

/* ---------------- UI refresh ---------------- */
function refreshUI(){
  document.getElementById('coinVal').textContent=save.coins;
  document.getElementById('unitsLvl').textContent=save.unitsLvl;
  document.getElementById('incomeLvl').textContent=save.incomeLvl;
  document.getElementById('unitsCost').textContent=unitsCost();
  document.getElementById('incomeCost').textContent=incomeCost();
  document.getElementById('lvlLabel').textContent='LEVEL '+save.level;
  document.getElementById('cardUnits').classList.toggle('afford',save.coins>=unitsCost());
  document.getElementById('cardIncome').classList.toggle('afford',save.coins>=incomeCost());
  // progress segments
  const segs=document.getElementById('segs'); segs.innerHTML='';
  const total=8;
  for(let i=0;i<total;i++){
    const d=document.createElement('div'); d.className='seg';
    const boss=(i===total-1);
    if(boss) d.classList.add('boss');
    const pos=((save.level-1)%total);
    if(i<pos) d.classList.add('done');
    if(i===pos) d.classList.add('cur');
    if(boss) d.textContent='💀';
    segs.appendChild(d);
  }
}

/* ---------------- flow ---------------- */
function showLobby(){
  state='lobby';
  setCount(startUnits());
  leaderX=targetX=0;
  document.getElementById('cards').classList.remove('hidden');
  document.getElementById('hint').classList.remove('hidden');
  document.getElementById('topbar').classList.remove('hidden');
  refreshUI();
}
function startRun(){
  runKind = levelKind(save.level);
  speed=0.06;   // constant pace — no speed-up per level, gives time to choose
  setCount(startUnits());
  leaderX=targetX=0;
  particles=[]; splats=[];
  document.getElementById('cards').classList.add('hidden');
  document.getElementById('hint').classList.add('hidden');
  if(runKind==='bonus'){ isBoss=false; bonus={idx:0,dir:1,locked:-1}; state='bonus'; return; }
  isBoss = runKind==='boss';
  state='run';
  buildLevel();
}
function startBossReward(){
  state='bossreward';
  bossReward={ base: Math.max(20, save.level*4 + Math.round(count*incomeMult()*0.3)),
               angle: Math.PI*1.5, dir:1, stopped:false, mult:1 };
}
function bossRewardAction(){
  if(state!=='bossreward') return;
  if(!bossReward.stopped){
    // stop the wheel and resolve the multiplier from the pointer angle
    bossReward.stopped=true;
    const frac=(bossReward.angle-Math.PI)/Math.PI;       // 0..1 across the fan
    bossReward.mult = frac<1/3 ? 2 : (frac<2/3 ? 5 : 3);
    burst(W/2, H*0.55, '#ffe27a', 50);
  } else {
    // claim and advance to next level
    save.coins += bossReward.base*bossReward.mult;
    save.level++; persist();
    showLobby();
  }
}
function lockBonus(){
  if(state!=='bonus' || bonus.locked>=0) return;
  bonus.locked = Math.round(bonus.idx);
  const m = bonusSteps[bonus.locked].m;
  setCount(Math.round(count*m));
  burst(W/2, H*0.5, '#ffe27a', 36);
  state='resolving';
  setTimeout(()=>endRun(true), 950);
}
function endRun(win){
  state='end';
  let reward=0;
  if(win){ reward=Math.max(20,count*incomeMult()*2); save.coins+=reward; save.level++; }
  else { reward=Math.max(10,enemyCount*incomeMult()); save.coins+=reward; }
  persist();
  const es=document.getElementById('endScreen'); es.classList.remove('hidden');
  let title = win?'🏆 Victory!':'💀 Defeated';
  let stat;
  if(!win){ stat = `${count||0} units couldn't beat ${isBoss?'the boss':enemyCount}.`; }
  else if(runKind==='bonus'){ title='🎁 Bonus!'; stat=`Multiplier ×${bonusSteps[Math.max(0,bonus.locked)].m} — your crowd grew to ${count}!`; }
  else if(runKind==='boss'){ title='👑 Boss Down!'; stat=`Your ${count} warriors took down the giant red boss!`; }
  else { stat = `Your army of ${count} crushed ${enemyCount} enemies!`; }
  document.getElementById('endTitle').textContent=title;
  document.getElementById('endStat').textContent=stat;
  document.getElementById('endReward').textContent='+ '+reward+' 🪙';
  document.getElementById('nextBtn').textContent=win?'NEXT LEVEL ▶':'TRY AGAIN ↻';
}
document.getElementById('nextBtn').onclick=()=>{
  document.getElementById('endScreen').classList.add('hidden');
  showLobby();
};

/* ---------------- update ---------------- */
function update(){
  leaderX += (targetX-leaderX)*0.16;

  if(state==='run'){
    for(const o of objects){
      o.z -= speed;
      if(!o.done && o.z<=0.4){
        if(o.type==='gate'){ o.done=true; applyOp(leaderX<0?o.left:o.right); }
        else if(o.type==='rock'||o.type==='pillar'||o.type==='gear'){
          o.done=true;
          const onSide=(o.side<0&&leaderX<0)||(o.side>0&&leaderX>=0);
          if(onSide){
            // clash: your crowd fights the red stickmen — blood splat + losses
            setCount(count-o.dmg);
            const p=project(leaderX,0.4);
            addSplat(p.x,p.y); addSplat(p.x-20,p.y+6); addSplat(p.x+22,p.y-4);
            burst(p.x,p.y,'#d63a3a',24);
            burst(p.x,p.y,'#ffffff',10);
          }
        } else if(o.type==='finish'){
          o.done=true; state='battle'; battleTimer=0;
          if(isBoss){
            battleEnemy = bossHP;   // boss HP drains like a mob
          } else {
            battleEnemy = enemyCount;
            enemyMob=[];
            for(let i=0;i<Math.min(enemyCount,100);i++){
              const ring=Math.sqrt(i);
              enemyMob.push({ ex:(Math.random()*2-1)*(0.12+ring*0.07),
                              ez:0.55+ring*0.05+Math.random()*0.05,
                              ph:Math.random()*6.28 });
            }
          }
        }
      }
    }
    if(count<=0){ endRun(false); }
  }
  else if(state==='battle'){
    battleTimer++;
    if(battleTimer%3===0 && count>0 && battleEnemy>0){
      const k=Math.max(1,Math.round((count+battleEnemy)/40));
      setCount(count-k); battleEnemy-=k;
      const p=project(leaderX*0.4,0.5); addSplat(p.x,p.y);
    }
    if(count<=0||battleEnemy<=0){
      const win=count>0;
      state='resolving';
      if(win && isBoss) setTimeout(()=>startBossReward(),600);
      else setTimeout(()=>endRun(win),550);
    }
  }
  else if(state==='bossreward' && !bossReward.stopped){
    bossReward.angle += bossReward.dir*0.055;
    if(bossReward.angle>=Math.PI*2){ bossReward.angle=Math.PI*2; bossReward.dir=-1; }
    if(bossReward.angle<=Math.PI){ bossReward.angle=Math.PI; bossReward.dir=1; }
  }
  else if(state==='bonus' && bonus.locked<0){
    bonus.idx += bonus.dir*0.045;
    if(bonus.idx>=bonusSteps.length-1){ bonus.idx=bonusSteps.length-1; bonus.dir=-1; }
    if(bonus.idx<=0){ bonus.idx=0; bonus.dir=1; }
  }

  for(const p of particles){ p.x+=p.vx; p.y+=p.vy; p.vy+=0.35; p.life-=0.03; }
  particles=particles.filter(p=>p.life>0);
  for(const s of splats){ s.r+=(s.max-s.r)*0.2; s.life-=0.012; }
  splats=splats.filter(s=>s.life>0);
}

/* ---------------- drawing ---------------- */
function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

function drawBackground(){
  // sky
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#9fd2f2'); g.addColorStop(0.5,'#bfe6ff'); g.addColorStop(1,'#e8f6ff');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // distant ice mountains
  ctx.fillStyle='#8fb9d8';
  for(let i=0;i<6;i++){
    const bx=i*W/5-20, bw=W/3;
    ctx.beginPath(); ctx.moveTo(bx,horizonY+10);
    ctx.lineTo(bx+bw/2, horizonY-40-((i*37)%30)); ctx.lineTo(bx+bw,horizonY+10); ctx.closePath(); ctx.fill();
  }
}

function drawRoad(){
  const nl=project(-1,0), nr=project(1,0), hl=project(-1,40), hr=project(1,40);
  // grass/ice sides
  ctx.fillStyle='#cfe9f5'; ctx.fillRect(0,horizonY,W,nearY-horizonY+H);
  // road body
  ctx.fillStyle='#9a9aa6';
  ctx.beginPath(); ctx.moveTo(nl.x,nl.y); ctx.lineTo(nr.x,nr.y); ctx.lineTo(hr.x,hr.y); ctx.lineTo(hl.x,hl.y); ctx.closePath(); ctx.fill();
  // soft top shade
  const rg=ctx.createLinearGradient(0,horizonY,0,nearY);
  rg.addColorStop(0,'rgba(255,255,255,.35)'); rg.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=rg; ctx.fill();
  // edges
  ctx.strokeStyle='#fff'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(nl.x,nl.y); ctx.lineTo(hl.x,hl.y);
  ctx.moveTo(nr.x,nr.y); ctx.lineTo(hr.x,hr.y); ctx.stroke();
  // rocky cliffs at sides
  drawCliffs();
}
function drawCliffs(){
  ctx.fillStyle='#7fa9c8';
  for(let z=2;z<40;z+=3){
    const f=camDist/(camDist+z);
    const lx=project(-1,z).x, ly=project(-1,z).y, s=70*f;
    blob3d(lx-s*0.7, ly, s, '#7fa9c8','#5d86a4');
    const rx=project(1,z).x, ry=project(1,z).y;
    blob3d(rx+s*0.7, ry, s, '#7fa9c8','#5d86a4');
  }
}
function blob3d(x,y,s,c1,c2){
  const g=ctx.createLinearGradient(x-s/2,y-s,x+s/2,y);
  g.addColorStop(0,c1); g.addColorStop(1,c2);
  ctx.fillStyle=g;
  ctx.beginPath(); ctx.moveTo(x-s*0.5,y); ctx.lineTo(x-s*0.2,y-s*1.1);
  ctx.lineTo(x+s*0.25,y-s*0.8); ctx.lineTo(x+s*0.5,y); ctx.closePath(); ctx.fill();
}

/* rounded 3D-ish character */
function drawChar(x,y,s,body,dark){
  const t=Date.now()/130;
  ctx.fillStyle='rgba(0,0,0,.18)';
  ctx.beginPath(); ctx.ellipse(x,y+s*0.06,s*0.5,s*0.16,0,0,6.28); ctx.fill();
  // body capsule
  const g=ctx.createLinearGradient(x-s*0.4,y-s,x+s*0.4,y);
  g.addColorStop(0,body); g.addColorStop(1,dark);
  ctx.fillStyle=g;
  roundRect(x-s*0.32,y-s*1.0,s*0.64,s*1.0,s*0.3); ctx.fill();
  // arms
  ctx.fillStyle=dark;
  roundRect(x-s*0.5,y-s*0.85,s*0.2,s*0.55,s*0.1); ctx.fill();
  roundRect(x+s*0.3,y-s*0.85,s*0.2,s*0.55,s*0.1); ctx.fill();
  // head
  const hg=ctx.createRadialGradient(x-s*0.1,y-s*1.45,s*0.05,x,y-s*1.3,s*0.5);
  hg.addColorStop(0,'#ffffff'); hg.addColorStop(1,body);
  ctx.fillStyle=hg;
  ctx.beginPath(); ctx.arc(x,y-s*1.28,s*0.4,0,6.28); ctx.fill();
}

/* red stickman (enemies) */
function drawStickman(x,y,s,color,ph){
  const sw=Math.sin(Date.now()/150+(ph||0))*s*0.14;   // little idle sway
  ctx.fillStyle='rgba(0,0,0,.15)';
  ctx.beginPath(); ctx.ellipse(x,y+s*0.05,s*0.4,s*0.13,0,0,6.28); ctx.fill();
  ctx.strokeStyle=color; ctx.fillStyle=color;
  ctx.lineWidth=Math.max(1.6,s*0.16); ctx.lineCap='round'; ctx.lineJoin='round';
  // head
  ctx.beginPath(); ctx.arc(x,y-s*1.12,s*0.3,0,6.28); ctx.fill();
  // body + limbs
  ctx.beginPath();
  ctx.moveTo(x,y-s*0.82); ctx.lineTo(x,y-s*0.3);
  ctx.moveTo(x,y-s*0.68); ctx.lineTo(x-s*0.3,y-s*0.46+sw);
  ctx.moveTo(x,y-s*0.68); ctx.lineTo(x+s*0.3,y-s*0.46-sw);
  ctx.moveTo(x,y-s*0.3); ctx.lineTo(x-s*0.26,y+s*0.12);
  ctx.moveTo(x,y-s*0.3); ctx.lineTo(x+s*0.26,y+s*0.12);
  ctx.stroke();
}
/* purple stud-cylinder barriers */
function drawCylinder(x,y,f){
  const w=64*f, h=150*f, top=y-h, ry=w*0.17;
  // ground shadow
  ctx.fillStyle='rgba(0,0,0,.18)';
  ctx.beginPath(); ctx.ellipse(x,y,w*0.55,w*0.18,0,0,6.28); ctx.fill();
  // body
  const g=ctx.createLinearGradient(x-w/2,0,x+w/2,0);
  g.addColorStop(0,'#4a2080'); g.addColorStop(.5,'#9b5ee6'); g.addColorStop(1,'#4a2080');
  ctx.fillStyle=g; ctx.fillRect(x-w/2,top,w,h);
  // bottom cap
  ctx.fillStyle='#3f1c70'; ctx.beginPath(); ctx.ellipse(x,y,w/2,ry,0,0,6.28); ctx.fill();
  // top cap
  ctx.fillStyle='#b07eed'; ctx.beginPath(); ctx.ellipse(x,top,w/2,ry,0,0,6.28); ctx.fill();
  // red studs
  for(let r=0;r<4;r++){
    for(let c=0;c<3;c++){
      const sx=x-w*0.3+c*(w*0.3);
      const sy=top+ry+h*0.13+r*(h*0.23);
      const rad=Math.max(1.5,w*0.085);
      ctx.fillStyle='#e23b3b'; ctx.beginPath(); ctx.arc(sx,sy,rad,0,6.28); ctx.fill();
      ctx.fillStyle='#ff8a8a'; ctx.beginPath(); ctx.arc(sx-rad*0.3,sy-rad*0.3,rad*0.4,0,6.28); ctx.fill();
    }
  }
}
function drawPillar(o){
  if(o.z<0) return;
  const base=o.side<0?-0.5:0.5;
  const cols=[-0.22,0,0.22];
  const pts=cols.map(dx=>({...project(base+dx,o.z)}));
  pts.sort((a,b)=>a.f-b.f);
  for(const p of pts) drawCylinder(p.x,p.y,p.f);
  // damage label above
  const c=project(base,o.z);
  const fs=Math.max(13,30*c.f);
  ctx.font=`800 ${fs}px system-ui`; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.lineWidth=Math.max(3,fs*0.18); ctx.strokeStyle='#fff'; ctx.fillStyle='#d63a3a';
  const ty=c.y-160*c.f-fs*0.5;
  ctx.strokeText('-'+o.dmg,c.x,ty); ctx.fillText('-'+o.dmg,c.x,ty);
  ctx.textBaseline='alphabetic';
}
/* spinning saw/gear barrier (image 3) */
function drawGear(o){
  if(o.z<0) return;
  const base=o.side<0?-0.5:0.5;
  const p=project(base,o.z); const s=80*p.f;
  const ang=Date.now()/280*(o.side<0?1:-1);
  ctx.save(); ctx.translate(p.x,p.y-s*0.5); ctx.rotate(ang);
  // teeth
  ctx.fillStyle='#7fd6f5';
  const teeth=10;
  for(let i=0;i<teeth;i++){ ctx.rotate(6.28/teeth); ctx.fillRect(-s*0.13,-s*0.98,s*0.26,s*0.34); }
  // disc
  ctx.fillStyle='#5cc8f0'; ctx.beginPath(); ctx.arc(0,0,s*0.72,0,6.28); ctx.fill();
  ctx.fillStyle='#46a6cf'; ctx.beginPath(); ctx.arc(0,0,s*0.46,0,6.28); ctx.fill();
  ctx.fillStyle='#e23b3b'; ctx.beginPath(); ctx.arc(0,0,s*0.2,0,6.28); ctx.fill();
  ctx.restore();
  // damage label
  const c=project(base,o.z); const fs=Math.max(13,30*c.f);
  ctx.font=`800 ${fs}px system-ui`; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.lineWidth=Math.max(3,fs*0.18); ctx.strokeStyle='#fff'; ctx.fillStyle='#d63a3a';
  const ty=c.y-s-fs*0.4;
  ctx.strokeText('-'+o.dmg,c.x,ty); ctx.fillText('-'+o.dmg,c.x,ty);
  ctx.textBaseline='alphabetic';
}

/* purple/pink castle backdrop for boss levels (images 1-2) */
function drawCastle(z){
  const p=project(0.55, Math.max(0.6, z*0.5+0.5));
  const u=Math.max(8, 64*p.f);
  const bx=p.x, by=p.y;
  const body='#c065c8', light='#d98ad9', roof='#8e84d8';
  function tower(x,w,h){
    ctx.fillStyle=body; ctx.fillRect(x,by-h,w,h);
    // battlements
    for(let i=0;i<w;i+=w/3){ ctx.fillRect(x+i,by-h-w*0.18,w/4,w*0.18); }
    // cone roof
    ctx.fillStyle=roof; ctx.beginPath();
    ctx.moveTo(x-w*0.15,by-h); ctx.lineTo(x+w/2,by-h-w*0.9); ctx.lineTo(x+w*1.15,by-h); ctx.closePath(); ctx.fill();
  }
  // keep + towers
  ctx.fillStyle=body; ctx.fillRect(bx-u*1.4, by-u*1.8, u*2.8, u*1.8);
  tower(bx-u*2.3, u*1.1, u*2.4);
  tower(bx+u*1.2, u*1.1, u*2.4);
  tower(bx-u*0.55, u*1.1, u*3.1);
  // gate
  ctx.fillStyle='#5b3a6e';
  ctx.beginPath(); ctx.moveTo(bx-u*0.45,by); ctx.lineTo(bx-u*0.45,by-u*0.8);
  ctx.arc(bx,by-u*0.8,u*0.45,Math.PI,0); ctx.lineTo(bx+u*0.45,by); ctx.closePath(); ctx.fill();
}

/* boss-defeated reward wheel (image 2) */
function drawBossReward(){
  // dim backdrop
  ctx.fillStyle='#0c1a30'; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  // header band
  ctx.fillStyle='rgba(40,90,150,.5)'; ctx.fillRect(0,H*0.10,W,H*0.09);
  ctx.fillStyle='#fff'; ctx.font='800 30px system-ui';
  ctx.fillText('BOSS DEFEATED', W/2, H*0.145);
  ctx.font='700 15px system-ui'; ctx.fillStyle='#9fc4e6';
  ctx.fillText('YOU EARNED', W/2, H*0.27);
  ctx.font='800 42px system-ui'; ctx.fillStyle='#7fd6ff';
  ctx.fillText(bossReward.base+' 💎', W/2, H*0.33);

  // semicircle wheel
  const cx=W/2, cy=H*0.60, R=Math.min(W*0.34,150);
  const segs=[{a0:Math.PI,a1:Math.PI*4/3,c:'#e8643c',t:'×2'},
              {a0:Math.PI*4/3,a1:Math.PI*5/3,c:'#3fbf4a',t:'×5'},
              {a0:Math.PI*5/3,a1:Math.PI*2,c:'#f0b429',t:'×3'}];
  for(const s of segs){
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,R,s.a0,s.a1); ctx.closePath();
    ctx.fillStyle=s.c; ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.4)'; ctx.lineWidth=2; ctx.stroke();
    const ma=(s.a0+s.a1)/2, lx=cx+Math.cos(ma)*R*0.62, ly=cy+Math.sin(ma)*R*0.62;
    ctx.fillStyle='#fff'; ctx.font='800 24px system-ui'; ctx.fillText(s.t,lx,ly);
  }
  // pointer
  const a=bossReward.angle;
  ctx.strokeStyle='#fff'; ctx.lineWidth=7; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+Math.cos(a)*R*0.92, cy+Math.sin(a)*R*0.92); ctx.stroke();
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(cx,cy,R*0.14,0,6.28); ctx.fill();

  // GET button / hint
  if(bossReward.stopped){
    const total=bossReward.base*bossReward.mult;
    const bw=W*0.6, bh=64, bx=W/2-bw/2, by=cy+R*0.45;
    ctx.fillStyle='#34c93f'; roundRect(bx,by,bw,bh,16); ctx.fill();
    ctx.fillStyle='#fff'; ctx.font='800 24px system-ui';
    ctx.fillText('GET  +'+total+' 💎', W/2, by+bh*0.4);
    ctx.font='700 13px system-ui'; ctx.fillStyle='#dffbe0';
    ctx.fillText('PRESS SPACE / TAP', W/2, by+bh*0.74);
  } else {
    ctx.fillStyle='#bcd'; ctx.font='700 17px system-ui';
    ctx.fillText('PRESS SPACE / TAP to STOP', W/2, cy+R*0.5+30);
  }
  ctx.textBaseline='alphabetic';
}

/* multiplier-stairs bonus stage (image 4) */
function drawBonus(){
  const n=bonusSteps.length;
  const cur = bonus.locked>=0 ? bonus.locked : Math.round(bonus.idx);
  const bw=W*0.46, bh=Math.max(20,H*0.05), gap=bh*0.42;
  const baseX=W*0.40, baseY=H*0.80, skew=bw*0.13;
  for(let i=0;i<n;i++){
    const x=baseX + i*(bw*0.035);
    const y=baseY - i*(bh+gap);
    const s=bonusSteps[i];
    ctx.fillStyle=s.c;
    ctx.beginPath();
    ctx.moveTo(x,y); ctx.lineTo(x+bw,y-skew); ctx.lineTo(x+bw,y-skew+bh); ctx.lineTo(x,y+bh); ctx.closePath(); ctx.fill();
    // front edge shade
    ctx.fillStyle='rgba(0,0,0,.18)';
    ctx.beginPath(); ctx.moveTo(x,y+bh); ctx.lineTo(x+bw,y-skew+bh); ctx.lineTo(x+bw,y-skew+bh+gap*0.7); ctx.lineTo(x,y+bh+gap*0.7); ctx.closePath(); ctx.fill();
    if(i===cur){ ctx.strokeStyle='#fff'; ctx.lineWidth=4;
      ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+bw,y-skew); ctx.lineTo(x+bw,y-skew+bh); ctx.lineTo(x,y+bh); ctx.closePath(); ctx.stroke(); }
    ctx.fillStyle='rgba(255,255,255,.95)'; ctx.font=`800 ${bh*0.62}px system-ui`;
    ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.fillText('×'+s.m.toFixed(1), x+14, y-skew*0.5+bh*0.5);
  }
  // pink crowd at bottom-left
  const cx=W*0.18, cy=H*0.80;
  for(let i=0;i<Math.min(crowd.length,36);i++){
    const ox=((i%6)-2.5)*15, oy=Math.floor(i/6)*-13;
    drawChar(cx+ox, cy+oy, 22, '#ff9ec9','#e06aa3');
  }
  // count
  ctx.fillStyle='#16263f'; ctx.font='800 26px system-ui'; ctx.textAlign='center';
  ctx.strokeStyle='#fff'; ctx.lineWidth=5;
  ctx.strokeText(count, cx, cy-95); ctx.fillText(count, cx, cy-95);
  // hint
  const msg = bonus.locked>=0 ? ('×'+bonusSteps[bonus.locked].m+'  →  '+count+'!') : 'TAP / SPACE to STOP';
  ctx.font='800 22px system-ui'; ctx.strokeStyle='#fff'; ctx.lineWidth=5;
  ctx.strokeText(msg, W/2, H*0.92); ctx.fillStyle='#16263f'; ctx.fillText(msg, W/2, H*0.92);
}

function drawGate(o){
  if(o.z<0) return;
  const h=2.4;
  for(const side of ['left','right']){
    const op=o[side];
    const xo=side==='left'?-1:0, xi=side==='left'?0:1;
    const bo=project(xo,o.z), bi=project(xi,o.z);
    const top=h*bo.f*60;
    const good=op.k==='mul'||op.k==='add';
    ctx.fillStyle= good?'rgba(70,170,255,.42)':'rgba(220,70,70,.42)';
    ctx.strokeStyle= good?'rgba(150,220,255,.95)':'rgba(255,150,150,.95)';
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(bo.x,bo.y); ctx.lineTo(bi.x,bi.y);
    ctx.lineTo(bi.x,bi.y-top); ctx.lineTo(bo.x,bo.y-top); ctx.closePath();
    ctx.fill(); ctx.stroke();
    // posts
    ctx.fillStyle='rgba(40,70,110,.9)';
    ctx.fillRect(bo.x-2,bo.y-top,4,top);
    ctx.fillRect(bi.x-2,bi.y-top,4,top);
    // label
    ctx.fillStyle='#fff'; ctx.font=`800 ${Math.max(12,28*bo.f)}px system-ui`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(op.t,(bo.x+bi.x)/2,bo.y-top*0.55);
  }
  ctx.textBaseline='alphabetic';
}
function drawRock(o){
  if(o.z<0) return;
  // a small blocking group of red stickmen on one side of the lane
  const base=o.side<0?-0.5:0.5;
  const offs=[[0,0.10],[-0.20,0.04],[0.20,0.05],[-0.07,0],[0.09,-0.02]];
  const pts=offs.map(([dx,dz],i)=>({...project(base+dx,o.z+dz),ph:i*1.7}));
  pts.sort((a,b)=>a.f-b.f);
  for(const p of pts) drawStickman(p.x,p.y,34*p.f,'#d63a3a',p.ph);
  // damage label above the group
  const c=project(base,o.z);
  const fs=Math.max(13,30*c.f);
  ctx.font=`800 ${fs}px system-ui`; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.lineWidth=Math.max(3,fs*0.18); ctx.strokeStyle='#fff'; ctx.fillStyle='#d63a3a';
  const ty=c.y-50*c.f-fs;
  ctx.strokeText('-'+o.dmg,c.x,ty); ctx.fillText('-'+o.dmg,c.x,ty);
  ctx.textBaseline='alphabetic';
}

function drawScene(){
  if(state==='bossreward'){ drawBossReward();
    for(const p of particles){ ctx.globalAlpha=Math.max(0,p.life); ctx.fillStyle=p.c; ctx.fillRect(p.x,p.y,4,4); }
    ctx.globalAlpha=1; return; }
  drawBackground();
  if(state==='bonus'){ drawBonus();
    for(const p of particles){ ctx.globalAlpha=Math.max(0,p.life); ctx.fillStyle=p.c; ctx.fillRect(p.x,p.y,4,4); }
    ctx.globalAlpha=1; return; }
  drawRoad();

  // collect drawables sorted far->near
  const draw=[];
  for(const o of objects){ if(!o.done||o.type==='finish') draw.push(o); }
  draw.sort((a,b)=>b.z-a.z);
  for(const o of draw){
    if(o.type==='gate') drawGate(o);
    else if(o.type==='rock') drawRock(o);
    else if(o.type==='pillar') drawPillar(o);
    else if(o.type==='gear') drawGear(o);
    else if(o.type==='finish'){
      if(isBoss) drawCastle(o.z);
      if(o.z>0){
        const cl=project(-1,o.z), cr=project(1,o.z); const cs=14*cl.f+6;
        for(let i=0,x=cl.x;x<cr.x;i++,x+=cs){
          ctx.fillStyle=i%2?'#fff':'#111'; ctx.fillRect(x,cl.y-cs,cs,cs);
        }
      }
      if(isBoss){
        // one giant red stickman boss
        const bp=project(0, Math.max(0.5, o.z*0.4+0.3));
        drawStickman(bp.x, bp.y, 150*bp.f, '#c62828', 0);
      } else if(state==='battle'||state==='resolving'){
        // red stickman enemy mob (stable positions, draw far->near)
        const n=Math.min(battleEnemy,enemyMob.length);
        const shown=enemyMob.slice(0,n).map(e=>({...project(e.ex,e.ez),ph:e.ph}));
        shown.sort((a,b)=>a.f-b.f);
        for(const s of shown) drawStickman(s.x,s.y,30*s.f,'#d63a3a',s.ph);
      }
    }
  }

  // splats (under crowd)
  for(const s of splats){
    ctx.globalAlpha=Math.max(0,s.life);
    ctx.fillStyle='#c0392b';
    ctx.beginPath(); ctx.ellipse(s.x,s.y,s.r,s.r*0.4,0,0,6.28); ctx.fill();
    ctx.fillStyle='rgba(70,140,220,.6)';
    ctx.beginPath(); ctx.ellipse(s.x,s.y,s.r*0.6,s.r*0.25,0,0,6.28); ctx.fill();
    ctx.globalAlpha=1;
  }

  // player crowd
  const drawN=Math.min(crowd.length,200);
  const blobs=[];
  for(let i=0;i<drawN;i++){
    const c=crowd[i];
    const p=project(leaderX+c.ox, 0.25+c.oz);
    blobs.push({...p, big:false});
  }
  // leader
  const lp=project(leaderX,0.2);
  blobs.push({...lp, big:true});
  blobs.sort((a,b)=>a.f-b.f);
  for(const b of blobs){
    if(b.big) drawChar(b.x,b.y,34*b.f,'#ff7ab8','#d44d92');   // leader: bright pink
    else drawChar(b.x,b.y,28*b.f,'#ff9ec9','#e06aa3');         // crowd: pink
  }

  // count above crowd
  if(state==='run'||state==='battle'){
    ctx.fillStyle='#16263f'; ctx.font='800 26px system-ui'; ctx.textAlign='center';
    ctx.strokeStyle='#fff'; ctx.lineWidth=5;
    const tx=lp.x, ty=lp.y-58;
    ctx.strokeText(count, tx, ty); ctx.fillText(count, tx, ty);
    if(state==='battle'){
      const lbl = isBoss ? ('BOSS HP '+Math.max(0,battleEnemy)) : ('VS '+Math.max(0,battleEnemy));
      ctx.fillStyle='#fff'; ctx.font='800 20px system-ui';
      ctx.strokeText(lbl, W/2, horizonY+60);
      ctx.fillStyle='#a23b36'; ctx.fillText(lbl, W/2, horizonY+60);
    }
  } else if(state==='lobby'){
    ctx.fillStyle='#16263f'; ctx.font='800 22px system-ui'; ctx.textAlign='center';
    ctx.strokeStyle='#fff'; ctx.lineWidth=5;
    ctx.strokeText('Start: '+count, lp.x, lp.y-56); ctx.fillText('Start: '+count, lp.x, lp.y-56);
  }

  // particles
  for(const p of particles){ ctx.globalAlpha=Math.max(0,p.life); ctx.fillStyle=p.c; ctx.fillRect(p.x,p.y,4,4); }
  ctx.globalAlpha=1;
}

/* ---------------- loop ---------------- */
function loop(){ update(); drawScene(); requestAnimationFrame(loop); }

resize();
showLobby();
loop();
</script>
