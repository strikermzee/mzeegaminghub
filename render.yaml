# MZeeGamingHub runs as one long-lived Node process: it holds Socket.IO and WebSocket
# connections open and keeps its SQLite file on disk. It needs a real server — static
# hosting and serverless platforms cannot run it.
services:
  - type: web
    name: mzee-gaming-hub
    env: node
    plan: free
    # The React games (Tambola, Ludo) are committed already built, under
    # public/games/. Render only needs the server's own dependencies — rebuilding
    # them here would pull ~1,300 extra packages for no gain.
    # If you ever strip the build output from the repo, use:
    #   npm install && npm run build
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true      # signs sessions AND the tokens the games trust
      - key: ADMIN_PASSWORD
        sync: false              # set this yourself; never ship the default
    # NOTE ON DATA
    # Render's free plan has no persistent disk, so data/hub.db — accounts, play
    # counts, categories, analytics — is wiped on every deploy and on the restart
    # that follows each idle spin-down.
    #
    # To keep data, move to a paid instance and uncomment:
    #
    # disk:
    #   name: hub-data
    #   mountPath: /opt/render/project/src/data
    #   sizeGB: 1
